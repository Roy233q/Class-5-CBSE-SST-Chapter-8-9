      section: 'Ch 8 • Let Us Practise (D1)',
      question: 'List some animals found in different grasslands of the world.',
      questionHi: 'दुनिया के अलग-अलग grasslands में पाए जाने वाले कुछ जानवरों के नाम लिखिए।',
      answer: 'Different grasslands of the world support various animals. Bison, coyote and black-footed ferret are found in the Prairies of North America. Puma, fox and tapir are found in the Pampas of South America. Snow leopard, leopard and falcon live in the Steppes of Eurasia. Zebra, African elephant and baboon live in the Velds of Africa. Kangaroo, wallaby and dingo are found in the Downs of Australia.',

        "India is blessed with many landforms – tall mountains, flat plains, sandy deserts, wide plateaus, green coastal plains and island groups. Each landform is home to unique plants, animals and people. Together, they create biodiversity – a variety of life forms that make our country special and diverse.",
        "In the north, the Himalayas rise like giant walls of snow and rock. Their high peaks remain covered with snow throughout the year. From these mountains flow mighty rivers such as the Ganga and the Brahmaputra, born from melting glaciers. These rivers bring fresh water and fertile soil to the lands below.",

    passage: {
      page: 'Page 74',
      title: 'E. Read the text given below and answer the questions that follow.',
      text: "In 2019, Chennai faced a severe water crisis as many rivers, lakes and reservoirs dried up due to drought and overuse. Water tankers and special trains had to supply drinking water to the city. People were asked to save every drop, and schools, offices and homes struggled every day. The crisis showed how even big cities suffer when natural water sources are not protected.",
      textHi: "2019 में, सूखे और पानी के ज़्यादा इस्तेमाल (overuse) के कारण कई नदियाँ, झीलें और जलाशय सूख जाने से Chennai में गंभीर जल संकट (water crisis) आ गया। शहर में पीने का पानी पहुँचाने के लिए पानी के टैंकर और स्पेशल ट्रेनें चलानी पड़ीं। लोगों से एक-एक बूँद बचाने को कहा गया और स्कूल, दफ़्तर व घर रोज़ परेशान रहे। इस संकट ने दिखाया कि प्राकृतिक जल स्रोतों को न बचाने पर बड़े शहर भी मुश्किल में पड़ जाते हैं।",
      questions: [
        { id: 'ch9_e1', q: '1. What happened in Chennai in 2019?', qHi: '2019 में Chennai में क्या हुआ था?', answer: 'In 2019, Chennai faced a severe water crisis as many rivers, lakes and reservoirs dried up, so water tankers and special trains had to supply drinking water.', easyAnswer: 'Chennai faced a severe water crisis in 2019 and needed water tankers and special trains.' },
        { id: 'ch9_e2', q: "2. What were two main causes of Chennai's water crisis?", qHi: 'Chennai के जल संकट के दो मुख्य कारण क्या थे?', answer: "The two main causes of Chennai's water crisis were drought (little rainfall) and overuse of water.", easyAnswer: 'The two main causes were drought and overuse of water.' },
        { id: 'ch9_e3', q: '3. What lessons can we learn to prevent such crises in the future?', qHi: 'भविष्य में ऐसे संकट रोकने के लिए हम क्या सबक सीख सकते हैं?', answer: 'We learn that we must protect natural water sources like rivers and lakes, save every drop of water, plant trees and avoid overusing water.', easyAnswer: 'We must protect rivers and lakes, save every drop of water, and avoid wasting water.' }
      ]
    },

  function init3DScene(containerId, mode, onSelect) {
    stop3D();
    const el = document.getElementById(containerId);
    if (!el || typeof THREE === 'undefined') return;
    el.innerHTML = '';
    const w = el.clientWidth || 640;
    const h = el.clientHeight || 360;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(mode === 'ch8' ? 0xbae6fd : 0x0ea5e9);
    scene.fog = new THREE.Fog(mode === 'ch8' ? 0xbae6fd : 0x38bdf8, 16, 40);

    const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
    camera.position.set(0, 7.5, 11.5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    el.appendChild(renderer.domElement);
    activeRenderer = renderer;

    const hemi = new THREE.HemisphereLight(0xffffff, 0x3f6212, 0.9);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xfffbeb, 1.0);
    dir.position.set(8, 14, 6);
    scene.add(dir);

    const clickables = [];
    const entities = mode === 'ch8' ? CH8_ENTITIES : CH9_REGIONS;

    if (mode === 'ch8') {
      // Rolling Grassland terrain
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(24, 18, 24, 24),
        new THREE.MeshLambertMaterial({ color: 0x84cc16 })
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // Winding river ribbon
      const river = new THREE.Mesh(
        new THREE.BoxGeometry(1.4, 0.08, 16),
        new THREE.MeshLambertMaterial({ color: 0x38bdf8 })
      );
      river.position.set(-0.2, 0.03, 0);
      river.rotation.y = 0.28;
      scene.add(river);

      // Distant mountains
      [[-7, 1.8, -6.5], [-4, 2.4, -7], [5, 2.0, -6.5]].forEach(([x, y, z]) => {
        const m = new THREE.Mesh(
          new THREE.ConeGeometry(2.4, y * 2, 6),
          new THREE.MeshLambertMaterial({ color: 0x64748b })
        );
        m.position.set(x, y, z);
        scene.add(m);
      });

      // Grain Silo cylinder
      const silo = new THREE.Mesh(
        new THREE.CylinderGeometry(0.65, 0.65, 2.4, 16),
        new THREE.MeshLambertMaterial({ color: 0xcbd5e1 })
      );
      silo.position.set(-2.2, 1.2, -1.5);
      scene.add(silo);
      const siloCap = new THREE.Mesh(
        new THREE.ConeGeometry(0.7, 0.6, 16),
        new THREE.MeshLambertMaterial({ color: 0x475569 })
      );
      siloCap.position.set(-2.2, 2.7, -1.5);
      scene.add(siloCap);

      // Golden wheat patch
      const wheat = new THREE.Mesh(
        new THREE.BoxGeometry(4.2, 0.14, 3.2),
        new THREE.MeshLambertMaterial({ color: 0xeab308 })
      );
      wheat.position.set(2.0, 0.06, 0.8);
      scene.add(wheat);
    } else {
      // Ocean base
      const ocean = new THREE.Mesh(
        new THREE.PlaneGeometry(28, 22),
        new THREE.MeshLambertMaterial({ color: 0x0284c7 })
      );
      ocean.rotation.x = -Math.PI / 2;
      scene.add(ocean);

      // Peninsular India stylized 3D landform blocks
      const north = new THREE.Mesh(new THREE.BoxGeometry(7.2, 0.5, 4.2), new THREE.MeshLambertMaterial({ color: 0x22c55e }));
      north.position.set(0, 0.25, -2.0);
      scene.add(north);

      const desert = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.55, 2.6), new THREE.MeshLambertMaterial({ color: 0xf59e0b }));
      desert.position.set(-3.0, 0.28, -1.4);
      scene.add(desert);

      const peninsula = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 0.7, 0.55, 3), new THREE.MeshLambertMaterial({ color: 0x65a30d }));
      peninsula.position.set(-0.3, 0.28, 1.6);
      peninsula.rotation.y = Math.PI;
      scene.add(peninsula);

      // Snowy Himalayas peaks
      [[-2.2, 1.5, -4.1], [-0.4, 2.0, -4.4], [1.4, 1.8, -4.2], [3.0, 1.4, -3.7]].forEach(([x, y, z]) => {
        const peak = new THREE.Mesh(new THREE.ConeGeometry(1.4, y * 1.9, 5), new THREE.MeshLambertMaterial({ color: 0xf8fafc }));
        peak.position.set(x, y * 0.95, z);
        scene.add(peak);
      });

      // Islands
      const andaman = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.65, 0.35, 8), new THREE.MeshLambertMaterial({ color: 0x10b981 }));
      andaman.position.set(3.5, 0.18, 3.2);
      scene.add(andaman);
    }

    // Add interactive glowing spheres / pins for each entity
    entities.forEach((ent) => {
      const grp = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.48, 20, 20),
        new THREE.MeshStandardMaterial({ color: ent.color, roughness: 0.35, metalness: 0.1 })
      );
      body.userData = { entity: ent };
      grp.add(body);

      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.66, 0.06, 8, 24),
        new THREE.MeshBasicMaterial({ color: 0xfef08a })
      );
      ring.rotation.x = Math.PI / 2;
      grp.add(ring);

      grp.position.set(ent.pos[0], ent.pos[1], ent.pos[2]);
      scene.add(grp);
      clickables.push(body);
      ent._grp = grp;
    });

    // Drag to orbit + click to pick
    let dragging = false, prevX = 0, angle = 0.0;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const dom = renderer.domElement;
    dom.style.cursor = 'grab';
    dom.addEventListener('pointerdown', (e) => { dragging = true; prevX = e.clientX; dom.style.cursor = 'grabbing'; });
    window.addEventListener('pointerup', () => { dragging = false; if (dom) dom.style.cursor = 'grab'; });
    dom.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      angle += (e.clientX - prevX) * 0.008;
      prevX = e.clientX;
    });
    dom.addEventListener('click', (e) => {
      const rect = dom.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(clickables);
      if (hits.length > 0 && hits[0].object.userData.entity) {
        onSelect(hits[0].object.userData.entity);
      }
    });

    let t = 0;
    function animate() {
      animId = requestAnimationFrame(animate);
      t += 0.02;
      if (!dragging) angle += 0.0025;
      camera.position.x = Math.sin(angle) * 11.5;
      camera.position.z = Math.cos(angle) * 11.5;
      camera.lookAt(0, 0.4, 0);
      entities.forEach((ent, i) => {
        if (ent._grp) ent._grp.position.y = ent.pos[1] + Math.sin(t * 1.8 + i) * 0.14;
      });
      renderer.render(scene, camera);
    }
    animate();
  }

    { id: 'indira', name: 'Indira Point (Andaman & Nicobar)', lon: 93.83, lat: 6.75, color: '#14b8a6', desc: 'Southernmost tip of India in the Andaman & Nicobar Islands.', hi: 'पूरे भारत का सबसे दक्षिणी छोर — अंडमान और निकोबार में!' }
  ];

  async function renderGeoMap(containerId, mapType, onPinClick) {
    const el = document.getElementById(containerId);
    if (!el || typeof d3 === 'undefined' || typeof topojson === 'undefined') return;
    el.innerHTML = '<div class="flex items-center justify-center h-full text-slate-500 text-sm">Loading interactive vector map...</div>';
    try {
      const resp = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json');
      const world = await resp.json();
      const countries = topojson.feature(world, world.objects.countries);

      const width = el.clientWidth || 640;
      const height = 340;
      el.innerHTML = '';
      const svg = d3.select(el).append('svg')
        .attr('viewBox', `0 0 ${width} ${height}`)
        .attr('class', 'w-full h-auto rounded-2xl bg-sky-100');

      const proj = mapType === 'world'
        ? d3.geoNaturalEarth1().fitSize([width - 20, height - 20], countries).translate([width / 2, height / 2])
        : d3.geoMercator().center([82.5, 20.5]).scale(width * 0.92).translate([width / 2, height / 2]);

      const path = d3.geoPath(proj);

      // Countries
      svg.selectAll('path.land')
        .data(countries.features)
        .enter().append('path')
        .attr('d', path)
        .attr('fill', d => (mapType === 'india' && d.id === '356') ? '#bbf7d0' : '#e2e8f0')
        .attr('stroke', '#94a3b8')
        .attr('stroke-width', 0.7);

      if (mapType === 'world') {
        // Draw Temperate Zone latitude guides (23.5 & 66.5)
        [66.5, 23.5, -23.5, -66.5].forEach(lat => {
          const line = { type: 'LineString', coordinates: [[-180, lat], [-90, lat], [0, lat], [90, lat], [180, lat]] };
          svg.append('path').datum(line).attr('d', path).attr('fill', 'none').attr('stroke', '#0ea5e9').attr('stroke-dasharray', '4,4').attr('stroke-width', 1);
        });
        WORLD_GRASSLANDS.forEach(g => {
          const pt = proj([g.lon, g.lat]);
          if (!pt) return;
          const grp = svg.append('g').attr('transform', `translate(${pt[0]},${pt[1]})`).style('cursor', 'pointer')
            .on('click', () => onPinClick(g));
          grp.append('circle').attr('r', 12).attr('fill', '#22c55e').attr('fill-opacity', 0.3);
          grp.append('circle').attr('r', 6).attr('fill', '#15803d').attr('stroke', '#fff').attr('stroke-width', 2);
          grp.append('text').attr('y', -10).attr('text-anchor', 'middle').attr('font-size', '11px').attr('font-weight', '700').attr('fill', '#0f172a').text(g.name);
        });
      } else {
        // Draw Ganga & Godavari river flows on India map
        const gangaLine = { type: 'LineString', coordinates: [[79.55, 31.63], [78.16, 29.95], [82.97, 25.31], [85.13, 25.6], [88.9, 21.95]] };
        const godavariLine = { type: 'LineString', coordinates: [[73.53, 19.93], [77.5, 19.0], [80.0, 18.2], [82.2, 16.75]] };
        svg.append('path').datum(gangaLine).attr('d', path).attr('fill', 'none').attr('stroke', '#0284c7').attr('stroke-width', 3).attr('stroke-linecap', 'round');
        svg.append('path').datum(godavariLine).attr('d', path).attr('fill', 'none').attr('stroke', '#6366f1').attr('stroke-width', 3).attr('stroke-linecap', 'round');

        INDIA_PINS.forEach(p => {
          const pt = proj([p.lon, p.lat]);
          if (!pt) return;
          const grp = svg.append('g').attr('transform', `translate(${pt[0]},${pt[1]})`).style('cursor', 'pointer')
            .on('click', () => onPinClick(p));
          grp.append('circle').attr('r', 10).attr('fill', p.color).attr('fill-opacity', 0.35);
          grp.append('circle').attr('r', 5.5).attr('fill', p.color).attr('stroke', '#fff').attr('stroke-width', 1.8);
          grp.append('text').attr('x', 8).attr('y', 4).attr('font-size', '10px').attr('font-weight', '700').attr('fill', '#0f172a').text(p.name.split(' (')[0]);
        });
      }
    } catch (err) {
      el.innerHTML = `<div class="p-4 bg-amber-50 rounded-2xl text-sm text-amber-900">Map data unavailable offline — use the interactive region buttons below to explore every location!</div>`;
    }
  }

  return {
    CH8_ENTITIES,
    CH9_REGIONS,
    WORLD_GRASSLANDS,
    INDIA_PINS,
    init3DScene,
    stop3D,
    renderGeoMap
  };
})();

  let state = loadState();
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? { ...DEFAULT_STATE, ...JSON.parse(raw) } : { ...DEFAULT_STATE };
    } catch (e) {
      return { ...DEFAULT_STATE };
    }
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // Synthesized gentle chime via Web Audio API (no external audio files)
  function playChime(ok = true) {
    if (state.muted) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(ok ? 523.25 : 260, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(ok ? 783.99 : 200, ctx.currentTime + 0.18);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.26);
    } catch (e) {}
  }

  function celebrate() {
    playChime(true);
    if (typeof confetti === 'function') {
      confetti({ particleCount: 55, spread: 65, origin: { y: 0.7 } });
    }
  }

  function awardStars(n, reason) {
    state.stars += n;
    checkBadges();
    saveState();
    showToast(`⭐ +${n} Stars! ${reason}`);
    updateTopStats();
  }

  function checkBadges() {
    const add = (id) => { if (!state.badges.includes(id)) state.badges.push(id); };
    if (state.completedTopics.some(t => t.startsWith('ch8_'))) add('Grassland Explorer');
    if (state.completedTopics.some(t => t.startsWith('ch9_'))) add('Geography Master');
    if (state.quizCorrect >= 5) add('Quiz Champion');
    if (state.masteredAnswers.length >= 2) add('Memory Champion');
    if (state.stars >= 50) add('SST Superhero');
  }

  function showToast(msg) {
    const el = document.getElementById('toast-box');
    if (!el) return;
    el.textContent = msg;
    el.classList.remove('opacity-0', 'translate-y-4');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.add('opacity-0', 'translate-y-4'), 2600);
  }

  setInterval(() => { state.studySeconds += 5; saveState(); }, 5000);

  // =========================================================================
  // AI GIRL TUTOR ("ANANYA DIDI") AUDIO ENGINE WITH WORD-BY-WORD SYNC
  // =========================================================================
  const AudioEngine = {
    sentences: [],
    sentIdx: 0,
    speed: 1.0,
    lang: 'hi-IN', // 'hi-IN' or 'en-IN'
    speaking: false,
    paused: false,
    fallbackTimer: null,
    title: '',

    openAndSpeak(title, text, lang = 'hi-IN') {
      this.stop();
      this.title = title;
      this.lang = lang;
      this.sentences = text.split(/(?<=[.!?।])\s+/).filter(s => s.trim().length > 0);
      if (this.sentences.length === 0) this.sentences = [text];
      this.sentIdx = 0;
      const bar = document.getElementById('tutor-audio-bar');
      if (bar) bar.classList.remove('hidden');
      this.renderSentenceText();
      this.speakCurrent();
    },

    renderSentenceText(activeWordIdx = -1) {
      const titleEl = document.getElementById('tutor-bar-title');
      const textEl = document.getElementById('tutor-bar-text');
      const sentInfo = document.getElementById('tutor-sent-info');
      if (titleEl) titleEl.textContent = `Ananya Didi • ${this.title}`;
      if (sentInfo) sentInfo.textContent = `Sentence ${this.sentIdx + 1} / ${this.sentences.length}`;
      if (!textEl) return;
      const words = (this.sentences[this.sentIdx] || '').split(/\s+/);
      textEl.innerHTML = words.map((w, i) =>
        `<span class="inline-block px-1 rounded transition-colors duration-150 ${i === activeWordIdx ? 'bg-amber-300 text-slate-900 font-bold scale-105 shadow-sm' : 'text-slate-700'}">${escapeHtml(w)}</span>`
      ).join(' ');
    },

    speakCurrent() {
      clearInterval(this.fallbackTimer);
      if (!('speechSynthesis' in window)) {
        this.renderSentenceText(0);
        showToast('Audio synthesis is unavailable in this browser; showing synced text.');
        return;
      }
      window.speechSynthesis.cancel();
      const sentence = this.sentences[this.sentIdx];
      if (!sentence) { this.speaking = false; return; }

      const utter = new SpeechSynthesisUtterance(sentence);
      utter.lang = this.lang;
      utter.rate = this.speed;
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => v.lang.toLowerCase().includes(this.lang.toLowerCase())) ||
                        voices.find(v => v.lang.toLowerCase().includes('en-in')) ||
                        voices.find(v => /female|samantha|google/i.test(v.name));
      if (preferred) utter.voice = preferred;

      const words = sentence.split(/\s+/);
      // Map char index -> word index for accurate onboundary highlighting
      const charStarts = [];
      let pos = 0;
      words.forEach(w => { charStarts.push(pos); pos += w.length + 1; });

      let boundaryFired = false;
      let fallbackIdx = 0;
      this.renderSentenceText(0);

      utter.onboundary = (e) => {
        if (e.name === 'word' || typeof e.charIndex === 'number') {
          boundaryFired = true;
          clearInterval(this.fallbackTimer);
          let idx = 0;
          for (let i = 0; i < charStarts.length; i++) {
            if (e.charIndex >= charStarts[i]) idx = i;
          }
          this.renderSentenceText(idx);
        }
      };

      // Graceful word sync fallback if OS TTS engine doesn't fire boundary events (common for Hindi voices)
      const msPerWord = Math.max(180, Math.round(360 / this.speed));
      this.fallbackTimer = setInterval(() => {
        if (!boundaryFired && this.speaking && !this.paused) {
          fallbackIdx++;
          if (fallbackIdx < words.length) this.renderSentenceText(fallbackIdx);
        }
      }, msPerWord);

      utter.onend = () => {
        clearInterval(this.fallbackTimer);
        if (this.speaking && this.sentIdx < this.sentences.length - 1) {
          this.sentIdx++;
          this.speakCurrent();
        } else {
          this.speaking = false;
          this.renderSentenceText(-1);
        }
      };
      utter.onerror = () => { clearInterval(this.fallbackTimer); this.speaking = false; };

      this.speaking = true;
      this.paused = false;
      window.speechSynthesis.speak(utter);
    },

    pause() {
      if ('speechSynthesis' in window) window.speechSynthesis.pause();
      this.paused = true;
    },
    resume() {
      if ('speechSynthesis' in window) window.speechSynthesis.resume();
      this.paused = false;
    },
    replay() { this.speakCurrent(); },
    prev() { if (this.sentIdx > 0) { this.sentIdx--; this.speakCurrent(); } },
    next() { if (this.sentIdx < this.sentences.length - 1) { this.sentIdx++; this.speakCurrent(); } },
    setSpeed(s) { this.speed = parseFloat(s); if (this.speaking) this.speakCurrent(); },
    stop() {
      clearInterval(this.fallbackTimer);
      this.speaking = false;
      this.paused = false;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    },
    close() {
      this.stop();
      const bar = document.getElementById('tutor-audio-bar');
      if (bar) bar.classList.add('hidden');
    }
  };
  window.AudioEngine = AudioEngine;

  // =========================================================================
  // CLICK-TO-HINGLISH TRANSLATION SYSTEM
  // =========================================================================
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function makeClickableEnglish(text) {
    // Splits text into clickable words, highlighting known difficult SST words
    return text.split(/(\s+)/).map(tok => {
      if (/^\s+$/.test(tok)) return tok;
      const clean = tok.toLowerCase().replace(/[^a-z]/g, '');
      const entry = window.SST_DICT[clean];
      if (entry) {
        return `<span class="dict-word cursor-pointer border-b-2 border-dotted border-amber-500 bg-amber-50/70 hover:bg-amber-200 rounded px-0.5 transition" title="${escapeHtml(entry.hi)}" data-word="${escapeHtml(clean)}" data-orig="${escapeHtml(tok)}">${escapeHtml(tok)}</span>`;
      }
      return `<span class="dict-word cursor-pointer hover:bg-sky-100 rounded px-0.5 transition" data-word="${escapeHtml(clean)}" data-orig="${escapeHtml(tok)}">${escapeHtml(tok)}</span>`;
    }).join('');
  }

      'Explain the Ganga in simple language.',
      'Why are mangroves important?'

        const foundWord = words.find(w => window.SST_DICT[w]);
        if (foundWord) {

          html = `<strong>${escapeHtml(foundWord)}</strong> का मतलब है: <b>${escapeHtml(d.hi)}</b><br>${escapeHtml(d.simple)}`;

        }
      }
      msgs.innerHTML += `<div class="mr-auto max-w-[90%] bg-amber-50 border border-amber-200 text-slate-800 rounded-2xl rounded-bl-sm px-3.5 py-2.5 text-sm leading-relaxed">${html}</div>`;
      msgs.scrollTop = msgs.scrollHeight;
      input.value = '';

  }

              <div class="mt-5 space-y-4">

                      `).join('')}

                    <div id="qc-fb-${qi}" class="hidden mt-2.5 p-2.5 rounded-xl text-xs font-bold"></div>
                  </div>

          <!-- Personal Notes + Complete & Next Footer -->

            <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
              <button ${state.topicIdx === 0 ? 'disabled' : ''} onclick="navigateSST('lesson', {chapterId:'${ch.id}', topicIdx:${Math.max(0, state.topicIdx - 1)}})" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-sm disabled:opacity-40">← Previous</button>
              <button id="btn-mark-done" class="px-5 py-2.5 rounded-xl ${isDone ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-emerald-600 text-white shadow hover:bg-emerald-700'} font-extrabold text-sm transition">${isDone ? '✅ Topic Completed!' : '✓ Mark Complete (+10 ⭐)'}</button>

                ? `<button onclick="navigateSST('lesson', {chapterId:'${ch.id}', topicIdx:${state.topicIdx + 1}})" class="px-4 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm shadow">Next Topic →</button>`
                : `<button onclick="navigateSST('exercises', {chapterId:'${ch.id}'})" class="px-4 py-2.5 rounded-xl bg-amber-500 text-white font-extrabold text-sm shadow">Go to Exercises →</button>`}

    // Wire events
    document.querySelectorAll('.mode-switch-btn').forEach(b => {

    const hiBtn = document.getElementById('btn-tutor-topic-hi');
    if (hiBtn) hiBtn.onclick = () => AudioEngine.openAndSpeak(topic.title, topic.tutorScript, 'hi-IN');
    const audioPlay = document.getElementById('audio-mode-play');
    if (audioPlay) audioPlay.onclick = () => AudioEngine.openAndSpeak(topic.title, topic.tutorScript, 'hi-IN');
    const enBtn = document.getElementById('btn-tutor-topic-en');
    if (enBtn) enBtn.onclick = () => AudioEngine.openAndSpeak(topic.title, topic.textbook.join(' '), 'en-IN');

    document.getElementById('btn-bookmark-topic').onclick = () => {
      if (state.bookmarks.includes(topic.id)) state.bookmarks = state.bookmarks.filter(x => x !== topic.id);
      else state.bookmarks.push(topic.id);
      saveState();
      renderLesson(root);
    };
    document.getElementById('topic-note-input').oninput = (e) => {
      state.notes[topic.id] = e.target.value; saveState();

        renderLesson(root);
      }

    // Quick Check buttons
    root.querySelectorAll('.qc-opt-btn').forEach(btn => {
      btn.onclick = () => {
        const qi = parseInt(btn.dataset.qi, 10);
        const oi = parseInt(btn.dataset.oi, 10);
        const qc = topic.quickCheck[qi];
        const fb = document.getElementById(`qc-fb-${qi}`);
        state.quizAttempted++;
        if (oi === qc.ans) {
          state.quizCorrect++;
          btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
          fb.className = 'mt-2.5 p-2.5 rounded-xl text-xs font-bold bg-emerald-100 text-emerald-900';
          fb.textContent = '🎉 ' + qc.expHi;
          celebrate();
          awardStars(5, 'Quick Check Correct!');

          btn.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-900');

      [window.SST_CH8, window.SST_CH9].forEach(c => {

      });

  // 3. 3D & INTERACTIVE WORLDS VIEW (BOTH CHAPTERS + MAPS + SIMULATORS)
  function renderExplore3D(root) {
    const isCh8 = state.chapterId === 'ch8';
    const sub = state.exploreSub || '3d';

    root.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5 bg-white rounded-2xl p-3 shadow-sm border border-slate-200">

          <button onclick="navigateSST('explore3d',{chapterId:'ch8',exploreSub:'3d'})" class="px-3.5 py-2 rounded-xl text-xs font-extrabold ${isCh8 ? 'bg-emerald-600 text-white shadow' : 'bg-slate-100 text-slate-700'}">🌾 Ch 8: 3D Grasslands</button>
          <button onclick="navigateSST('explore3d',{chapterId:'ch9',exploreSub:'3d'})" class="px-3.5 py-2 rounded-xl text-xs font-extrabold ${!isCh8 ? 'bg-sky-600 text-white shadow' : 'bg-slate-100 text-slate-700'}">🇮🇳 Ch 9: 3D India</button>
        </div>
        <div class="flex flex-wrap gap-1.5">

          <button onclick="navigateSST('explore3d',{chapterId:'${state.chapterId}',exploreSub:'map'})" class="px-3 py-1.5 rounded-xl text-xs font-bold ${sub === 'map' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700'}">🗺️ Interactive Map</button>
          <button onclick="navigateSST('explore3d',{chapterId:'${state.chapterId}',exploreSub:'lab'})" class="px-3 py-1.5 rounded-xl text-xs font-bold ${sub === 'lab' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700'}">🎮 Simulators & Labs</button>
        </div>
      </div>
      <div id="explore-stage"></div>
    `;

    const stage = document.getElementById('explore-stage');
    if (sub === '3d') render3DStage(stage, isCh8);
    else if (sub === 'map') renderMapStage(stage, isCh8);
    else renderLabsStage(stage, isCh8);
  }

  function render3DStage(stage, isCh8) {
    const items = isCh8 ? window.SST_3D.CH8_ENTITIES : window.SST_3D.CH9_REGIONS;
    stage.innerHTML = `
      <div class="grid lg:grid-cols-12 gap-5">
        <div class="lg:col-span-8 bg-white rounded-3xl p-4 shadow-md border border-slate-100">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div>
              <h2 class="text-lg font-black text-slate-900">${isCh8 ? '🌾 Explore the Temperate Grasslands in 3D' : '🇮🇳 Explore Incredible India in 3D'}</h2>

      const panel = document.getElementById('entity-info-panel');

          </div>
          <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-sm text-slate-800">${makeClickableEnglish(ent.facts)}</div>

        <!-- Let Us Practise D: Short/Long Q&A (Linked to 8-Mode Memorizer) -->

          <span class="text-xs font-black uppercase text-indigo-600">Let Us Practise • Section D</span>
          <h3 class="text-lg font-black text-slate-900 mb-3">D. Answer the following questions.</h3>
          <div class="space-y-3">
            ${ch.qaBank.filter(q => q.id.includes('_d')).map((qa, i) => `
              <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">
                <div class="flex flex-wrap items-start justify-between gap-2">
                  <div>
                    <div class="font-bold text-sm text-slate-900">${i + 1}. ${makeClickableEnglish(qa.question)}</div>
                    <div class="text-xs font-semibold text-indigo-600">${escapeHtml(qa.questionHi)}</div>
                  </div>

          <span class="text-xs font-black uppercase text-indigo-600">Let Us Practise • ${ex.passage.page}</span>
          <h3 class="text-lg font-black text-slate-900">${escapeHtml(ex.passage.title)}</h3>
          <div class="p-4 rounded-2xl bg-sky-50 border border-sky-200 text-sm text-slate-800 leading-relaxed">${makeClickableEnglish(ex.passage.text)}</div>
          <div class="p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-xs sm:text-sm font-medium text-amber-950">${escapeHtml(ex.passage.textHi)}</div>
          <div class="space-y-2.5">
            ${ex.passage.questions.map(pq => `
              <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                <div class="font-bold text-sm text-slate-900">${makeClickableEnglish(pq.q)}</div>
                <div class="text-xs font-semibold text-indigo-600 mb-1.5">${escapeHtml(pq.qHi)}</div>
                <div class="text-xs sm:text-sm text-emerald-900 bg-emerald-50 p-2.5 rounded-lg border border-emerald-200"><b>Answer:</b> ${escapeHtml(pq.answer)}</div>

          </div>
        </div>

        <!-- HOTS -->
        <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-100 space-y-4">
          <span class="text-xs font-black uppercase text-rose-600">Critical Thinking • ${ex.hots.page}</span>

          ${ch.qaBank.filter(q => q.id.includes('_h')).map((qa, i) => `
            <div class="p-4 rounded-2xl bg-rose-50/50 border border-rose-200 space-y-2">
              <div class="flex flex-wrap justify-between gap-2">
                <div>
                  <div class="font-bold text-sm text-slate-900">${i + 1}. ${makeClickableEnglish(qa.question)}</div>
                  <div class="text-xs font-semibold text-indigo-600">${escapeHtml(qa.questionHi)}</div>

              <div class="text-xs sm:text-sm text-slate-800 bg-white p-3 rounded-xl border border-slate-200">${makeClickableEnglish(qa.answer)}</div>

            <div class="font-black text-indigo-900 mb-1">🎨 A. PROJECT WORK</div>
            <p>${makeClickableEnglish(ex.activities.projectWork.en)}</p>
            <p class="text-xs font-semibold text-indigo-800 mt-1.5">${escapeHtml(ex.activities.projectWork.hi)}</p>
          </div>
          <div class="p-4 rounded-2xl bg-pink-50 border border-pink-200 text-sm">
            <div class="font-black text-pink-900 mb-1">✂️ B. ACTIVITY ZONE</div>
            <p>${makeClickableEnglish(ex.activities.activityZone.en)}</p>
            <p class="text-xs font-semibold text-pink-800 mt-1.5">${escapeHtml(ex.activities.activityZone.hi)}</p>
          </div>
          <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-sm">
            <div class="font-black text-emerald-900 mb-1">🌱 Life Skills</div>
            <p>${makeClickableEnglish(ex.activities.lifeSkills.en)}</p>
            <p class="text-xs font-semibold text-emerald-800 mt-1.5">${escapeHtml(ex.activities.lifeSkills.hi)}</p>
          </div>
          <div class="p-4 rounded-2xl bg-amber-50 border border-amber-200 text-sm">
            <div class="font-black text-amber-900 mb-1">🌐 Web References (${ex.activities.page})</div>
            <ul class="space-y-1.5 mt-1">
              ${ex.activities.webReferences.map(w => `<li><a href="${w.url}" target="_blank" rel="noopener" class="text-indigo-700 font-bold underline hover:text-indigo-900">🔗 ${escapeHtml(w.label)}</a></li>`).join('')}
            </ul>
          </div>
        </div>
      </div>
    `;

    // Wire Gear Up
    if (isCh8) {
      document.getElementById('gearup-ch8-chk').onclick = () => {
        const v = document.getElementById('gearup-ch8-in').value.trim().toUpperCase();
        const fb = document.getElementById('gearup-ch8-fb');
        if (v === 'PRAIRIES') { fb.textContent = '🎉 सही जवाब: PRAIRIES!'; fb.className = 'text-xs font-bold text-emerald-700'; celebrate(); awardStars(5, 'Solved Gear Up!'); }
        else { fb.textContent = '💡 Hint: ' + ch.gearUp.hintHi; fb.className = 'text-xs font-bold text-amber-700'; playChime(false); }
      };
    } else {
      document.getElementById('gu9-chk-btn').onclick = () => {
        let ok = 0;
        root.querySelectorAll('.gu9-in').forEach(inp => {
          const i = parseInt(inp.dataset.gidx, 10);
          const it = ch.gearUp.items[i];
          const val = inp.value.trim().toLowerCase();
          const fb = document.getElementById(`gu9-fb-${i}`);
          if (it.answers.some(a => val.includes(a) || a.includes(val) && val.length > 3)) {
            ok++; fb.textContent = '✅ ' + it.displayAns; fb.className = 'text-xs font-bold text-emerald-700';
          } else {
            fb.textContent = '💡 Answer: ' + it.displayAns; fb.className = 'text-xs font-bold text-amber-700';
          }
        });
        if (ok === 3) { celebrate(); awardStars(10, 'Solved Ch 9 Gear Up!'); }
      };
    }

    // Wire Yes/No & True/False blocks
    root.querySelectorAll('.yn-btn').forEach(b => {
      b.onclick = () => {
        const ans = b.dataset.ans, pick = b.dataset.pick, fbId = b.dataset.fb, exp = b.dataset.exp;
        const fb = document.getElementById(fbId);
        state.quizAttempted++;
        if (pick === ans) {
          state.quizCorrect++;
          fb.textContent = '🎉 ' + exp; fb.className = 'mt-1.5 text-xs font-bold text-emerald-700';
          celebrate(); awardStars(3, 'Correct!');
        } else {
          fb.textContent = '💡 ' + exp; fb.className = 'mt-1.5 text-xs font-bold text-rose-700';
          playChime(false); saveState();
        }
      };
    });

    // Wire FIB blocks
    root.querySelectorAll('.fib-chk-btn').forEach(b => {
      b.onclick = () => {
        const prefix = b.dataset.prefix;
        const block = prefix === 'lup_fib' ? ex.fib : (isCh8 ? ex.progressMilestone2 : ex.progressMilestone1);
        let correct = 0;
        block.items.forEach((it, i) => {
          const inp = document.getElementById(`${prefix}-in-${i}`);
          const fb = document.getElementById(`${prefix}-fb-${i}`);
          const v = (inp.value || '').trim().toLowerCase();
          if (it.answers.some(a => v === a || v.includes(a))) {
            correct++; fb.textContent = '✅ ' + it.expHi; fb.className = 'text-xs font-bold text-emerald-700 mt-1';
          } else {
            fb.textContent = `💡 Answer: ${it.displayAns} — ${it.expHi}`; fb.className = 'text-xs font-bold text-amber-700 mt-1';
          }
        });
        if (correct === block.items.length) { celebrate(); awardStars(10, 'All Fill in the Blanks Correct!'); }
        else playChime(correct > 0);
      };
    });

    // Wire MCQ
    root.querySelectorAll('.ex-mcq-btn').forEach(b => {
      b.onclick = () => {
        const idx = parseInt(b.dataset.idx, 10), oi = parseInt(b.dataset.oi, 10);
        const item = ex.mcq.items[idx];
        const fb = document.getElementById(`ex-mcq-fb-${idx}`);
        state.quizAttempted++;
        if (oi === item.ans) {
          state.quizCorrect++;
          b.classList.add('bg-emerald-100', 'border-emerald-500');
          fb.className = 'mt-2 text-xs font-bold p-2 rounded-xl bg-emerald-100 text-emerald-900';
          fb.textContent = '🎉 ' + item.expHi;
          celebrate(); awardStars(5, 'MCQ Correct!');
        } else {
          b.classList.add('bg-rose-100', 'border-rose-400');
          fb.className = 'mt-2 text-xs font-bold p-2 rounded-xl bg-amber-100 text-amber-900';
          fb.textContent = '💡 ' + item.expHi;
          playChime(false); saveState();
        }
      };
    });

    // Wire Match (Ch 8)
    const matchBtn = document.getElementById('ex-match-chk');
    if (matchBtn) {
      matchBtn.onclick = () => {
        let ok = 0;
        root.querySelectorAll('.ex-match-sel').forEach(sel => {
          const i = parseInt(sel.dataset.mi, 10);
          if (sel.value === ex.match.pairs[i].right) { ok++; sel.classList.add('border-emerald-500', 'bg-emerald-50'); }
          else sel.classList.add('border-rose-400', 'bg-rose-50');
        });
        const fb = document.getElementById('ex-match-fb');
        fb.textContent = ok === 4 ? '🎉 4/4 Perfect Match! (+10 Stars)' : `${ok}/4 सही! Hint: Downs-Australia, Prairies-North America, Pampas-South America, Velds-South Africa.`;
        fb.className = `mt-2 text-xs font-bold ${ok === 4 ? 'text-emerald-700' : 'text-amber-700'}`;
        if (ok === 4) { celebrate(); awardStars(10, 'Perfect Match the Following!'); }
      };
    }

    // Wire HOTS MCQ
    root.querySelectorAll('.hots-mcq-btn').forEach(b => {
      b.onclick = () => {
        const oi = parseInt(b.dataset.hoi, 10);
        const fb = document.getElementById('hots-mcq-fb');
        if (oi === ex.hots.mcqItem.ans) {
          fb.className = 'mt-2 text-xs font-bold p-2 rounded-xl bg-emerald-100 text-emerald-900';
          fb.textContent = '🎉 ' + ex.hots.mcqItem.expHi;
          celebrate(); awardStars(5, 'HOTS Correct!');
        } else {
          fb.className = 'mt-2 text-xs font-bold p-2 rounded-xl bg-amber-100 text-amber-900';
          fb.textContent = '💡 ' + ex.hots.mcqItem.expHi;
          playChime(false);
        }
      };
    });

    // Wire Picture Talk
    root.querySelectorAll('.pt-chk').forEach(b => {
      b.onclick = () => {
        const i = parseInt(b.dataset.pti, 10);
        const pq = ex.pictureTalk.questions[i];
        const inp = root.querySelector(`.pt-in[data-pti="${i}"]`);
        const fb = document.getElementById(`pt-fb-${i}`);
        const v = (inp.value || '').trim().toLowerCase();
        if (pq.answers.some(a => v.includes(a))) {
          fb.textContent = '🎉 ' + pq.expHi; fb.className = 'text-xs font-bold text-emerald-700';
          celebrate(); awardStars(5, 'Picture Talk Correct!');
        } else {
          fb.textContent = `💡 Answer: ${pq.displayAns} — ${pq.expHi}`; fb.className = 'text-xs font-bold text-amber-700';
          playChime(false);
        }
      };
    });

    // Wire Open Memorizer buttons
    root.querySelectorAll('.open-mem-btn').forEach(b => {
      b.onclick = () => {
        const idx = window.SST_GAMES.ALL_QA.findIndex(q => q.id === b.dataset.qaid);
        state.memQaIdx = idx >= 0 ? idx : 0;
        state.memMode = 1;
        navigate('memorize');
      };
    });
  }

  function renderYesNoBlock(block, prefix, labels = ['Yes', 'No']) {
    return `
      <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-100">
        <span class="text-xs font-black uppercase text-emerald-600">${block.page}</span>
        <h3 class="text-lg font-black text-slate-900 mb-3">${escapeHtml(block.title)}</h3>
        <div class="space-y-3">
          ${block.items.map((it, i) => `
            <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <div class="font-bold text-sm text-slate-900">${i + 1}. ${makeClickableEnglish(it.q)}</div>
                  <div class="text-xs font-semibold text-indigo-600">${escapeHtml(it.qHi)}</div>
                </div>
                <div class="flex gap-2">
                  ${labels.map(lbl => `<button data-ans="${it.ans}" data-pick="${lbl}" data-fb="${prefix}-fb-${i}" data-exp="${escapeHtml(it.expHi)}" class="yn-btn px-3.5 py-1.5 rounded-xl bg-white border border-slate-300 hover:bg-indigo-50 text-xs font-extrabold">${lbl}</button>`).join('')}

  function renderFibBlock(block, prefix) {
    return `
      <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-100">
        <span class="text-xs font-black uppercase text-amber-600">${block.page}</span>
        <h3 class="text-lg font-black text-slate-900 mb-3">${escapeHtml(block.title)}</h3>
        <div class="space-y-3">
          ${block.items.map((it, i) => `
            <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 space-y-1.5">
              <div class="font-bold text-sm text-slate-900">${i + 1}. ${makeClickableEnglish(it.q)}</div>
              <div class="text-xs font-semibold text-indigo-600">${escapeHtml(it.qHi)}</div>
              <input id="${prefix}-in-${i}" type="text" placeholder="Type missing word..." class="w-full sm:w-72 px-3 py-1.5 rounded-xl border border-slate-300 text-xs font-bold"/>

            </div>
          `).join('')}

      </div>
    `;
  }

  // 5. 8-MODE ANSWER MEMORIZATION STUDIO
  function renderMemorize(root) {
    const qas = window.SST_GAMES.ALL_QA;
    const qa = qas[state.memQaIdx] || qas[0];
    const mode = state.memMode || 1;
    const modes = [
      '1. Understand', '2. Break Parts', '3. Keywords', '4. Speak & Repeat',
      '5. Missing Words', '6. Complete Answer', '7. Write Memory', '8. Final Recall'
    ];
    const activeAns = state.showEasyAnswer ? qa.easyAnswer : qa.answer;

    let modeBody = '';
    if (mode === 1) {
      modeBody = `
        <div class="space-y-3">
          <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 text-sm sm:text-base leading-relaxed text-slate-900">${makeClickableEnglish(activeAns)}</div>
          <div class="p-4 rounded-2xl bg-amber-50 border border-amber-200 text-sm font-semibold text-amber-950">
            <div class="text-xs font-black uppercase text-amber-700 mb-1">💡 Easy Hinglish Memory Trick</div>
            ${escapeHtml(qa.trickHi)}
          </div>
          <div class="flex flex-wrap gap-2">
            <button id="mem-listen-en" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">🔊 Listen English Answer</button>
            <button id="mem-listen-hi" class="px-4 py-2 rounded-xl bg-pink-600 text-white text-xs font-extrabold">🗣️ Listen Hinglish Trick</button>
          </div>
        </div>
      `;
    } else if (mode === 2) {
      modeBody = `
        <div class="space-y-2.5">
          ${qa.parts.map((pt, i) => `
            <div class="p-3.5 rounded-2xl bg-sky-50 border border-sky-200 flex items-start justify-between gap-2">
              <div>
                <span class="inline-block px-2 py-0.5 rounded-md bg-sky-600 text-white text-[10px] font-black mb-1">Part ${i + 1}</span>
                <p class="text-sm font-bold text-slate-900">${makeClickableEnglish(pt)}</p>
                <p class="text-xs font-semibold text-indigo-700 mt-0.5">${escapeHtml(qa.partsHi[i] || '')}</p>
              </div>
              <button data-pt="${escapeHtml(pt)}" class="part-say-btn px-2.5 py-1.5 rounded-xl bg-white border border-sky-300 text-xs font-bold shrink-0">🔊</button>
            </div>
          `).join('')}
        </div>
      `;
    } else if (mode === 3) {
      let highlighted = escapeHtml(activeAns);
      qa.keywords.forEach(kw => {
        const re = new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        highlighted = highlighted.replace(re, '<mark class="bg-amber-300 text-slate-900 font-black px-1 rounded">$1</mark>');
      });
      modeBody = `
        <div class="space-y-3">
          <div class="flex flex-wrap gap-2">
            ${qa.keywords.map(k => `<span class="px-3 py-1 rounded-full bg-amber-100 border border-amber-300 text-amber-950 text-xs font-black">🔑 ${escapeHtml(k)}</span>`).join('')}
          </div>
          <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 text-sm sm:text-base leading-relaxed">${highlighted}</div>
        </div>
      `;
    } else if (mode === 4) {
      modeBody = `
        <div class="space-y-3">
          <p class="text-xs font-bold text-indigo-700">🎤 पहले Ananya Didi को सुनो, फिर 'Speak Now' दबाकर वही लाइन बोलो!</p>
          ${qa.parts.map((pt, i) => `
            <div class="p-3.5 rounded-2xl bg-purple-50 border border-purple-200 flex flex-wrap items-center justify-between gap-2">
              <span class="text-sm font-bold text-slate-900 flex-1">${i + 1}. ${escapeHtml(pt)}</span>
              <div class="flex gap-1.5">
                <button data-pt="${escapeHtml(pt)}" class="part-say-btn px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold">🔊 Listen</button>
                <button data-pt="${escapeHtml(pt)}" data-i="${i}" class="part-mic-btn px-3 py-1.5 rounded-xl bg-pink-600 text-white text-xs font-bold">🎤 Repeat</button>
              </div>
              <div id="mic-fb-${i}" class="w-full text-xs font-bold text-purple-800"></div>
            </div>
          `).join('')}
        </div>
      `;
    } else if (mode === 5) {
      const blanks = qa.keywords.slice(0, 4);
      let masked = escapeHtml(activeAns);
      blanks.forEach((kw, i) => {
        const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
        masked = masked.replace(re, `<input data-kw="${escapeHtml(kw)}" class="mem-blank-in inline-block w-32 px-2 py-0.5 mx-1 rounded-lg border-2 border-indigo-400 bg-white text-xs font-black text-indigo-900" placeholder="word ${i + 1}..."/>`);
      });
      modeBody = `
        <div class="space-y-3">
          <p class="text-xs font-bold text-slate-600">Word Bank Hint: ${blanks.map(b => `<span class="px-2 py-0.5 rounded bg-amber-100 text-amber-900 mx-0.5">${escapeHtml(b)}</span>`).join('')}</p>
          <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 text-sm leading-loose">${masked}</div>
          <button id="mem-blank-chk" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">Check Missing Words</button>
          <div id="mem-blank-fb" class="text-xs font-bold"></div>
        </div>
      `;
    } else if (mode === 6) {
      modeBody = `
        <div class="space-y-3">
          <p class="text-xs font-bold text-indigo-700">हर वाक्य की शुरुआत दी गई है — बाकी लाइन खुद पूरी करो!</p>
          ${qa.parts.map((pt, i) => {
            const starter = pt.split(' ').slice(0, 4).join(' ');
            return `
              <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 space-y-1.5">
                <div class="text-xs font-black text-indigo-700">${escapeHtml(starter)} ...</div>
                <input type="text" placeholder="Complete this sentence..." class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-semibold"/>
                <details class="text-xs text-emerald-800"><summary class="cursor-pointer font-bold">👁️ Peek Full Line</summary><div class="mt-1">${escapeHtml(pt)}</div></details>
              </div>
            `;
          }).join('')}
        </div>
      `;
    } else {
      // Mode 7 (Write from Memory) & Mode 8 (Final Recall Evaluation)
      modeBody = `
        <div class="space-y-3">
          <p class="text-xs font-bold text-indigo-700">${mode === 7 ? '✍️ बिना देखे अपनी याद से जवाब लिखो:' : '🏆 Final Recall Test! जवाब लिखो और Check दबाओ — हम तुम्हारे keywords जाँचेंगे!'}</p>
          <textarea id="mem-write-box" rows="4" placeholder="Type your answer in English here..." class="w-full p-3.5 rounded-2xl border-2 border-indigo-200 text-sm font-medium focus:outline-none focus:border-indigo-500"></textarea>
          <div class="flex flex-wrap gap-2">
            <button id="mem-eval-btn" class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold shadow">✅ Evaluate My Answer</button>
            <button id="mem-show-model" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">👁️ Compare with Model Answer</button>
          </div>
          <div id="mem-eval-fb" class="hidden p-4 rounded-2xl text-sm"></div>
        </div>
      `;
    }

    root.innerHTML = `
      <div class="grid lg:grid-cols-12 gap-5">
        <aside class="lg:col-span-4 bg-white rounded-3xl p-4 shadow-md border border-slate-100 max-h-[640px] overflow-y-auto space-y-1.5">
          <h3 class="font-black text-slate-800 text-sm mb-2">📚 All Textbook Questions (${qas.length})</h3>
          ${qas.map((q, i) => `
            <button data-qi="${i}" class="mem-q-pick w-full text-left p-2.5 rounded-xl text-xs font-bold transition ${i === state.memQaIdx ? 'bg-purple-600 text-white shadow' : 'hover:bg-slate-100 text-slate-700'}">
              <div class="text-[10px] opacity-80">${escapeHtml(q.section)} ${state.masteredAnswers.includes(q.id) ? '🏆' : ''}</div>
              <div class="line-clamp-2">${escapeHtml(q.question)}</div>
            </button>
          `).join('')}
        </aside>

        <div class="lg:col-span-8 bg-white rounded-3xl p-6 shadow-md border border-slate-100 space-y-4">
          <div class="flex flex-wrap items-start justify-between gap-2">
            <div>
              <span class="text-xs font-black uppercase text-purple-600">${escapeHtml(qa.section)}</span>
              <h2 class="text-xl font-black text-slate-900 mt-0.5">${makeClickableEnglish(qa.question)}</h2>
              <p class="text-xs font-bold text-indigo-600 mt-0.5">${escapeHtml(qa.questionHi)}</p>
            </div>
            <button id="toggle-easy-ans" class="px-3 py-1.5 rounded-xl text-xs font-extrabold border ${state.showEasyAnswer ? 'bg-emerald-100 border-emerald-400 text-emerald-900' : 'bg-slate-100 border-slate-200 text-slate-700'}">
              ${state.showEasyAnswer ? '✨ Showing: Easy Exam Answer' : '📘 Showing: Full Textbook Answer'}
            </button>
          </div>

          <!-- 8 Mode Pills -->
          <div class="flex flex-wrap gap-1.5">
            ${modes.map((m, i) => `<button data-m="${i + 1}" class="mem-mode-btn px-2.5 py-1.5 rounded-xl text-xs font-extrabold transition ${mode === i + 1 ? 'bg-indigo-600 text-white shadow' : 'bg-slate-100 text-slate-600 hover:bg-indigo-50'}">${m}</button>`).join('')}
          </div>

          <div>${modeBody}</div>
        </div>
      </div>
    `;

    root.querySelectorAll('.mem-q-pick').forEach(b => {
      b.onclick = () => { state.memQaIdx = parseInt(b.dataset.qi, 10); saveState(); renderMemorize(root); };
    });
    root.querySelectorAll('.mem-mode-btn').forEach(b => {
      b.onclick = () => { state.memMode = parseInt(b.dataset.m, 10); saveState(); renderMemorize(root); };
    });
    document.getElementById('toggle-easy-ans').onclick = () => {
      state.showEasyAnswer = !state.showEasyAnswer; saveState(); renderMemorize(root);
    };

    const listenEn = document.getElementById('mem-listen-en');
    if (listenEn) listenEn.onclick = () => AudioEngine.openAndSpeak('Textbook Answer', activeAns, 'en-IN');
    const listenHi = document.getElementById('mem-listen-hi');
    if (listenHi) listenHi.onclick = () => AudioEngine.openAndSpeak('Memory Trick', qa.questionHi + ' ' + qa.trickHi, 'hi-IN');

    root.querySelectorAll('.part-say-btn').forEach(b => {
      b.onclick = () => AudioEngine.openAndSpeak('Repeat After Me', b.dataset.pt, 'en-IN');
    });
    root.querySelectorAll('.part-mic-btn').forEach(b => {
      b.onclick = () => {
        const fb = document.getElementById(`mic-fb-${b.dataset.i}`);
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          fb.textContent = '🎤 Voice mic preview unavailable here — read the sentence aloud clearly twice!';
          return;
        }
        const rec = new SR();
        rec.lang = 'en-IN';
        fb.textContent = '🎙️ Listening... Speak the sentence now!';
        rec.onresult = (e) => {
          const said = e.results[0][0].transcript;
          fb.textContent = `✅ You said: "${said}" — शाबाश! बहुत बढ़िया प्रयास!`;
          playChime(true);
        };
        rec.onerror = () => { fb.textContent = '🎤 Mic permission needed or unavailable — read aloud to practise!'; };
        rec.start();
      };
    });

    const blankChk = document.getElementById('mem-blank-chk');
    if (blankChk) {
      blankChk.onclick = () => {
        let ok = 0, total = 0;
        root.querySelectorAll('.mem-blank-in').forEach(inp => {
          total++;
          const expected = inp.dataset.kw.toLowerCase();
          if (inp.value.trim().toLowerCase().includes(expected)) { ok++; inp.classList.add('bg-emerald-100'); }
          else inp.classList.add('bg-rose-100');
        });
        const fb = document.getElementById('mem-blank-fb');
        fb.textContent = ok === total ? '🎉 सभी Missing Words सही हैं! (+10 Stars)' : `${ok}/${total} सही! ऊपर दिए गए Word Bank से मदद लो।`;
        fb.className = `text-xs font-bold ${ok === total ? 'text-emerald-700' : 'text-amber-700'}`;
        if (ok === total) { celebrate(); awardStars(10, 'Mastered Missing Words!'); }
      };
    }

    const evalBtn = document.getElementById('mem-eval-btn');
    if (evalBtn) {
      evalBtn.onclick = () => {
        const txt = (document.getElementById('mem-write-box').value || '').toLowerCase();
        const fb = document.getElementById('mem-eval-fb');
        const matched = qa.keywords.filter(k => txt.includes(k.toLowerCase()));
        const pct = Math.round((matched.length / Math.max(1, qa.keywords.length)) * 100);
        fb.classList.remove('hidden');
        fb.className = `p-4 rounded-2xl text-sm ${pct >= 50 ? 'bg-emerald-50 border border-emerald-200 text-emerald-950' : 'bg-amber-50 border border-amber-200 text-amber-950'}`;
        fb.innerHTML = `
          <div class="font-black text-base">${pct >= 70 ? '🏆 Super Recall!' : pct >= 40 ? '👍 Good Effort!' : '💪 Keep Practising!'} Keyword Match: ${pct}% (${matched.length}/${qa.keywords.length})</div>
          <div class="text-xs mt-1"><b>Matched:</b> ${matched.join(', ') || 'None yet'}</div>
          <div class="text-xs mt-1"><b>Model Answer:</b> ${escapeHtml(activeAns)}</div>
        `;
        if (pct >= 60) {
          if (!state.masteredAnswers.includes(qa.id)) state.masteredAnswers.push(qa.id);
          celebrate(); awardStars(15, 'Mastered Textbook Answer!');
        }
      };
    }
    const showModel = document.getElementById('mem-show-model');
    if (showModel) {
      showModel.onclick = () => {
        const fb = document.getElementById('mem-eval-fb');
        fb.classList.remove('hidden');
        fb.className = 'p-4 rounded-2xl text-sm bg-indigo-50 border border-indigo-200 text-indigo-950';
        fb.innerHTML = `<b>Model Answer:</b> ${escapeHtml(activeAns)}`;
      };
    }
  }

  // 6. GAME & ACTIVITY CENTRE
  let gameIdx = 0, memCards = [], memFlipped = [], memMatched = [];
  function renderGames(root) {
    const gamesList = [
      { id: 'mcq', label: '🎯 MCQ Quiz' },
      { id: 'sort', label: '🦁 Animal Sorting' },
      { id: 'memory', label: '🃏 Memory Match' },
      { id: 'translate', label: '🔤 Sentence Translate' },
      { id: 'missing', label: '🧩 Missing Letters' },
      { id: 'flashcards', label: '🗂️ Flashcards' },
      { id: 'wheel', label: '🎡 Spin Wheel' },
      { id: 'exam', label: '⏱️ Exam Mode' }
    ];
    root.innerHTML = `
      <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200 flex flex-wrap gap-2 mb-5">
        ${gamesList.map(g => `<button data-gid="${g.id}" class="game-tab-btn px-3 py-2 rounded-xl text-xs font-extrabold transition ${state.activeGame === g.id ? 'bg-indigo-600 text-white shadow' : 'bg-slate-100 text-slate-700 hover:bg-indigo-50'}">${g.label}</button>`).join('')}
      </div>
      <div id="game-arena" class="bg-white rounded-3xl p-6 shadow-md border border-slate-100"></div>
    `;
    root.querySelectorAll('.game-tab-btn').forEach(b => {
      b.onclick = () => { state.activeGame = b.dataset.gid; gameIdx = 0; saveState(); renderGames(root); };
    });

    const arena = document.getElementById('game-arena');
    const g = state.activeGame;

    if (g === 'mcq' || g === 'exam') {
      const list = window.SST_GAMES.ALL_MCQS;
      const item = list[gameIdx % list.length];
      arena.innerHTML = `
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs font-black uppercase text-indigo-600">${g === 'exam' ? '⏱️ Realistic Exam Mode' : '🎯 Boss Level MCQ Challenge'} • Q ${(gameIdx % list.length) + 1} / ${list.length}</span>
          <span class="text-xs font-bold bg-amber-100 text-amber-900 px-3 py-1 rounded-full">Chapter ${item.ch}</span>
        </div>
        <h3 class="text-lg font-black text-slate-900">${makeClickableEnglish(item.q)}</h3>
        <p class="text-xs font-bold text-indigo-600 mt-1 mb-4">${escapeHtml(item.qHi)}</p>
        <div class="grid sm:grid-cols-2 gap-3">
          ${item.options.map((o, oi) => `<button data-oi="${oi}" class="g-mcq-opt text-left p-3.5 rounded-2xl bg-slate-50 hover:bg-indigo-50 border border-slate-200 text-sm font-bold">${escapeHtml(o)}</button>`).join('')}
        </div>
        <div id="g-mcq-fb" class="hidden mt-4 p-3.5 rounded-2xl text-sm font-bold"></div>
        <button id="g-mcq-next" class="mt-4 px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">Next Question →</button>
      `;
      arena.querySelectorAll('.g-mcq-opt').forEach(b => {
        b.onclick = () => {
          const oi = parseInt(b.dataset.oi, 10);
          const fb = document.getElementById('g-mcq-fb');
          state.quizAttempted++;
          if (oi === item.ans) {
            state.quizCorrect++;
            fb.className = 'mt-4 p-3.5 rounded-2xl text-sm font-bold bg-emerald-100 text-emerald-900';
            fb.textContent = '🎉 शाबाश! ' + item.expHi;
            celebrate(); awardStars(5, 'Quiz Star!');
          } else {
            fb.className = 'mt-4 p-3.5 rounded-2xl text-sm font-bold bg-amber-100 text-amber-900';
            fb.textContent = '💡 ' + item.expHi;
            playChime(false);
            if (!state.mistakes.some(m => m.q === item.q)) state.mistakes.push({ q: item.q, a: item.options[item.ans], hi: item.expHi });
            saveState();
          }
        };
      });
      document.getElementById('g-mcq-next').onclick = () => { gameIdx++; renderGames(root); };
    } else if (g === 'sort') {
      const animal = window.SST_GAMES.ANIMAL_SORT[gameIdx % window.SST_GAMES.ANIMAL_SORT.length];
      const regions = ['Prairies (North America)', 'Pampas (South America)', 'Steppes (Eurasia)', 'Velds (Africa)', 'Downs (Australia)'];
      arena.innerHTML = `
        <div class="text-center space-y-3">
          <span class="text-xs font-black uppercase text-emerald-600">🦁 Animal-to-Grassland Sorting Game</span>
          <div class="text-6xl">${animal.emoji}</div>
          <h3 class="text-2xl font-black text-slate-900">${animal.name}</h3>
          <p class="text-xs font-bold text-indigo-600">यह जानवर किस grassland में पाया जाता है? सही बटन दबाओ!</p>
          <div class="flex flex-wrap justify-center gap-2.5 pt-2">
            ${regions.map(r => `<button data-r="${r}" class="sort-btn px-4 py-2.5 rounded-2xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-xs font-extrabold text-emerald-900">${r}</button>`).join('')}
          </div>
          <div id="sort-fb" class="text-sm font-bold pt-2"></div>
        </div>
      `;
      arena.querySelectorAll('.sort-btn').forEach(b => {
        b.onclick = () => {
          const fb = document.getElementById('sort-fb');
          if (b.dataset.r === animal.region) {
            fb.className = 'text-sm font-bold pt-2 text-emerald-700';
            fb.textContent = `🎉 सही! ${animal.name} → ${animal.region}!`;
            celebrate(); awardStars(5, 'Animal Sorted!');
            setTimeout(() => { gameIdx++; renderGames(root); }, 950);
          } else {
            fb.className = 'text-sm font-bold pt-2 text-rose-700';
            fb.textContent = `Oops! फिर कोशिश करो! Hint: ${animal.name} यहाँ नहीं मिलता।`;
            playChime(false);
          }
        };
      });
    } else if (g === 'memory') {
      if (memCards.length === 0) {
        memCards = window.SST_GAMES.MEMORY_PAIRS.flatMap(p => [{ id: p.id, txt: p.a }, { id: p.id, txt: p.b }]).sort(() => Math.random() - 0.5);
        memFlipped = []; memMatched = [];
      }
      arena.innerHTML = `
        <div class="flex justify-between items-center mb-4">
          <div><h3 class="text-lg font-black text-slate-900">🃏 SST Memory Card Match</h3><p class="text-xs text-slate-500">सही जोड़ी (pairs) ढूँढो!</p></div>
          <button id="mem-reset" class="px-3 py-1.5 rounded-xl bg-slate-100 text-xs font-bold">🔄 Restart</button>
        </div>
        <div class="grid grid-cols-3 sm:grid-cols-4 gap-3">
          ${memCards.map((c, i) => {
            const open = memFlipped.includes(i) || memMatched.includes(c.id);
            return `<button data-ci="${i}" class="mcard-btn h-20 rounded-2xl font-extrabold text-xs p-2 transition border-2 ${memMatched.includes(c.id) ? 'bg-emerald-100 border-emerald-400 text-emerald-900' : open ? 'bg-amber-100 border-amber-400 text-slate-900' : 'bg-indigo-600 border-indigo-700 text-white'}">${open ? escapeHtml(c.txt) : '❓'}</button>`;
          }).join('')}
        </div>
      `;
      document.getElementById('mem-reset').onclick = () => { memCards = []; renderGames(root); };
      arena.querySelectorAll('.mcard-btn').forEach(b => {
        b.onclick = () => {
          const i = parseInt(b.dataset.ci, 10);
          if (memFlipped.includes(i) || memMatched.includes(memCards[i].id) || memFlipped.length >= 2) return;
          memFlipped.push(i);
          renderGames(root);
          if (memFlipped.length === 2) {
            const [a, c2] = memFlipped;
            if (memCards[a].id === memCards[c2].id) {
              memMatched.push(memCards[a].id);
              memFlipped = [];
              playChime(true);
              if (memMatched.length === window.SST_GAMES.MEMORY_PAIRS.length) { celebrate(); awardStars(15, 'Memory Match Champion!'); }
              setTimeout(() => renderGames(root), 350);
            } else {
              setTimeout(() => { memFlipped = []; renderGames(root); }, 700);
            }
          }
        };
      });
    } else if (g === 'translate') {
      const st = window.SST_GAMES.SENTENCE_TRANS[gameIdx % window.SST_GAMES.SENTENCE_TRANS.length];
      arena.innerHTML = `
        <div class="space-y-3">
          <span class="text-xs font-black uppercase text-indigo-600">🔤 English → Hinglish Sentence Match</span>
          <h3 class="text-xl font-black text-slate-900">"${escapeHtml(st.en)}"</h3>
          <div class="space-y-2">
            ${st.options.map((o, oi) => `<button data-oi="${oi}" class="tr-opt-btn w-full text-left p-3.5 rounded-2xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-sm font-bold">${escapeHtml(o)}</button>`).join('')}
          </div>
          <div id="tr-fb" class="text-sm font-bold"></div>
        </div>
      `;
      arena.querySelectorAll('.tr-opt-btn').forEach(b => {
        b.onclick = () => {
          const fb = document.getElementById('tr-fb');
          if (parseInt(b.dataset.oi, 10) === st.ans) {
            fb.className = 'text-sm font-bold text-emerald-700'; fb.textContent = '🎉 बिल्कुल सही अनुवाद! (+5 Stars)';
            celebrate(); awardStars(5, 'Sentence Translation Correct!');
            setTimeout(() => { gameIdx++; renderGames(root); }, 1000);
          } else {
            fb.className = 'text-sm font-bold text-rose-700'; fb.textContent = 'फिर कोशिश करो!'; playChime(false);
          }
        };
      });
    } else if (g === 'missing') {
      const ml = window.SST_GAMES.MISSING_LETTERS[gameIdx % window.SST_GAMES.MISSING_LETTERS.length];
      arena.innerHTML = `
        <div class="text-center space-y-3 max-w-md mx-auto">
          <span class="text-xs font-black uppercase text-purple-600">🧩 Missing Letters Puzzle</span>
          <p class="text-sm font-bold text-slate-700">${escapeHtml(ml.clue)}</p>
          <div class="font-mono text-2xl font-black tracking-widest bg-purple-50 py-3 rounded-2xl border border-purple-200 text-purple-900">${ml.masked}</div>
          <input id="ml-in" type="text" placeholder="Type full word..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-center font-black uppercase"/>
          <button id="ml-chk" class="px-5 py-2.5 rounded-xl bg-purple-600 text-white text-xs font-extrabold">Check Word</button>
          <div id="ml-fb" class="text-sm font-bold"></div>
        </div>
      `;
      document.getElementById('ml-chk').onclick = () => {
        const v = document.getElementById('ml-in').value.trim().toUpperCase();
        const fb = document.getElementById('ml-fb');
        if (v === ml.word) {
          fb.className = 'text-sm font-bold text-emerald-700'; fb.textContent = `🎉 Correct: ${ml.word}!`;
          celebrate(); awardStars(5, 'Puzzle Solved!');
          setTimeout(() => { gameIdx++; renderGames(root); }, 950);
        } else {
          fb.className = 'text-sm font-bold text-amber-700'; fb.textContent = `Try again! Starts with "${ml.word[0]}"`;
          playChime(false);
        }
      };
    } else if (g === 'flashcards') {
      const keys = Object.keys(window.SST_DICT);
      const word = keys[gameIdx % keys.length];
      const info = window.SST_DICT[word];
      arena.innerHTML = `
        <div class="text-center max-w-md mx-auto space-y-4">
          <span class="text-xs font-black uppercase text-amber-600">🗂️ Interactive Hinglish Flashcards (${(gameIdx % keys.length) + 1}/${keys.length})</span>
          <div id="fc-card" class="cursor-pointer p-8 rounded-3xl bg-gradient-to-br from-indigo-500 to-purple-600 text-white shadow-xl transition">
            <div class="text-xs uppercase opacity-80">Tap to Flip Card</div>
            <div class="text-3xl font-black mt-2 capitalize">${escapeHtml(word)}</div>
            <div id="fc-back" class="hidden mt-4 pt-4 border-t border-white/30">
              <div class="text-lg font-bold text-amber-200">${escapeHtml(info.hi)}</div>
              <div class="text-xs mt-1">${escapeHtml(info.simple)}</div>
            </div>
          </div>
          <div class="flex justify-center gap-3">
            <button onclick="AudioEngine.openAndSpeak('${word}', '${escapeHtml(info.hi)}', 'hi-IN')" class="px-4 py-2 rounded-xl bg-amber-100 text-amber-900 text-xs font-extrabold">🗣️ Listen</button>
            <button id="fc-next" class="px-5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">Next Card →</button>
          </div>
        </div>
      `;
      document.getElementById('fc-card').onclick = () => document.getElementById('fc-back').classList.toggle('hidden');
      document.getElementById('fc-next').onclick = () => { gameIdx++; renderGames(root); };
    } else if (g === 'wheel') {
      arena.innerHTML = `
        <div class="text-center max-w-lg mx-auto space-y-4">
          <h3 class="text-xl font-black text-slate-900">🎡 Spin the Question Wheel!</h3>
          <div id="wheel-box" class="w-40 h-40 mx-auto rounded-full bg-gradient-to-tr from-amber-400 via-pink-500 to-indigo-600 flex items-center justify-center text-white font-black text-3xl shadow-xl border-4 border-white transition-transform duration-700">🎯</div>
          <button id="spin-btn" class="px-6 py-3 rounded-2xl bg-indigo-600 text-white font-black text-sm shadow-lg hover:bg-indigo-700">🎡 Spin Wheel!</button>
          <div id="wheel-q" class="hidden p-4 rounded-2xl bg-amber-50 border border-amber-200 text-left space-y-2"></div>
        </div>
      `;
      document.getElementById('spin-btn').onclick = () => {
        const wb = document.getElementById('wheel-box');
        wb.style.transform = `rotate(${360 + Math.floor(Math.random() * 720)}deg)`;
        const item = window.SST_GAMES.WHEEL_QUESTIONS[Math.floor(Math.random() * window.SST_GAMES.WHEEL_QUESTIONS.length)];
        setTimeout(() => {
          const wq = document.getElementById('wheel-q');
          wq.classList.remove('hidden');
          wq.innerHTML = `<div class="font-black text-slate-900">❓ ${escapeHtml(item.q)}</div><details class="text-sm font-bold text-emerald-800"><summary class="cursor-pointer">👁️ Reveal Answer</summary><div class="mt-1">${escapeHtml(item.a)}</div></details>`;
          playChime(true);
        }, 650);
      };
    }
  }

  // 7. SMART SPACED-REPETITION REVISION & VOCABULARY NOTEBOOK
  function renderRevision(root) {
    root.innerHTML = `
      <div class="grid md:grid-cols-2 gap-6">
        <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-100 space-y-3">
          <h3 class="text-lg font-black text-slate-900">🔁 Spaced Repetition Schedule</h3>
          <p class="text-xs text-slate-500">Smart revision plan based on your progress (After Lesson → Day 1 → Day 3 → Day 7):</p>
          <div class="space-y-2">
            <div class="p-3 rounded-2xl bg-emerald-50 border border-emerald-200 text-xs font-bold text-emerald-900">📌 Today (Immediate): Review ${state.completedTopics.length || 1} recent topic(s) & ${state.mistakes.length} mistake(s)</div>
            <div class="p-3 rounded-2xl bg-sky-50 border border-sky-200 text-xs font-bold text-sky-900">📅 After 1 Day: Quick Check + Flashcards of Ch 8 & Ch 9</div>
            <div class="p-3 rounded-2xl bg-purple-50 border border-purple-200 text-xs font-bold text-purple-900">📅 After 3 Days: 8-Mode Answer Recall (D1–D5 & HOTS)</div>
            <div class="p-3 rounded-2xl bg-amber-50 border border-amber-200 text-xs font-bold text-amber-900">📅 After 7 Days: Full Boss Level Exam Mode</div>
          </div>
          <h4 class="font-black text-slate-800 text-sm pt-2">❌ Mistake Revision Bank (${state.mistakes.length})</h4>
          ${state.mistakes.length === 0
            ? `<p class="text-xs text-emerald-700 font-bold bg-emerald-50 p-3 rounded-xl">🎉 कोई गलती नहीं है! बहुत बढ़िया चल रहे हो!</p>`
            : state.mistakes.map(m => `<div class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs"><div class="font-bold text-slate-900">${escapeHtml(m.q)}</div><div class="text-emerald-800 font-bold mt-0.5">✅ ${escapeHtml(m.a)}</div><div class="text-slate-600">${escapeHtml(m.hi)}</div></div>`).join('')}
        </div>

        <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-100 space-y-3">
          <h3 class="text-lg font-black text-slate-900">📖 My Personal Vocabulary Notebook (${state.vocabBook.length})</h3>
          <p class="text-xs text-slate-500">Words you saved from Click-to-Translate appear here!</p>
          <div class="space-y-2 max-h-80 overflow-y-auto">
            ${state.vocabBook.map(v => `
              <div class="p-3 rounded-2xl bg-amber-50 border border-amber-200 flex items-center justify-between gap-2">
                <div><div class="font-black text-sm text-slate-900 capitalize">${escapeHtml(v.word)}</div><div class="text-xs font-semibold text-amber-900">${escapeHtml(v.hi)}</div></div>
                <button onclick="AudioEngine.openAndSpeak('${escapeHtml(v.word)}', '${escapeHtml(v.hi)}', 'hi-IN')" class="px-2.5 py-1 rounded-lg bg-white border border-amber-300 text-xs font-bold">🔊</button>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  }

  // 8. PARENT DASHBOARD
  function renderParent(root) {
    const mins = Math.max(1, Math.round(state.studySeconds / 60));
    const acc = state.quizAttempted ? Math.round((state.quizCorrect / state.quizAttempted) * 100) : 0;
    root.innerHTML = `
      <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-100 space-y-5">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <span class="text-xs font-black uppercase text-indigo-600">Parent & Teacher Progress Monitor</span>
            <h2 class="text-2xl font-black text-slate-900">👨‍👩‍👧 Parent Dashboard</h2>
          </div>
          <button id="reset-prog-btn" class="px-3.5 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-extrabold border border-rose-200">Reset Progress</button>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
          ${statBox('⏱️', mins + ' min', 'Study Time', 'bg-indigo-50 text-indigo-800')}
          ${statBox('📘', chapterProgress('ch8') + '%', 'Ch 8 Mastery', 'bg-emerald-50 text-emerald-800')}
          ${statBox('🇮🇳', chapterProgress('ch9') + '%', 'Ch 9 Mastery', 'bg-sky-50 text-sky-800')}
          ${statBox('🎯', acc + '%', `Accuracy (${state.quizCorrect}/${state.quizAttempted})`, 'bg-amber-50 text-amber-800')}
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
          <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
            <h4 class="font-black text-sm text-slate-800 mb-2">📌 Topics Needing Practice</h4>
            <p class="text-xs text-slate-600">${state.mistakes.length ? state.mistakes.map(m => '• ' + escapeHtml(m.q)).join('<br>') : 'No weak topics flagged yet — great accuracy!'}</p>
          </div>
          <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
            <h4 class="font-black text-sm text-slate-800 mb-2">⭐ Bookmarks & Saved Notes</h4>
            <p class="text-xs text-slate-600">Bookmarked Topics: <b>${state.bookmarks.length}</b> • Personal Notes Written: <b>${Object.keys(state.notes).filter(k => state.notes[k].trim()).length}</b> • Mastered Q&As: <b>${state.masteredAnswers.length}</b></p>
          </div>
        </div>
      </div>
    `;
    document.getElementById('reset-prog-btn').onclick = () => {
      state = { ...DEFAULT_STATE };
      saveState();
      updateTopStats();
      showToast('Progress reset cleanly!');
      renderParent(root);
    };
  }

  // Boot app
  window.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.nav-tab-btn').forEach(b => {
      b.onclick = () => navigate(b.dataset.view);
    });
    const muteBtn = document.getElementById('mute-toggle-btn');
    if (muteBtn) {
      muteBtn.onclick = () => {
        state.muted = !state.muted; saveState();
        muteBtn.textContent = state.muted ? '🔇' : '🔊';
      };
    }
    initAIAssistant();
    updateTopStats();
    renderMain();
  });
})();

</script>
</body>
</html>
